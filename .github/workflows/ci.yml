name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  style:
    name: Style
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run repository guardrails
        run: make guardrails

      - name: Install Swift style tools
        run: ./Scripts/install_format_tools.sh install

      - name: Run Swift style lint
        run: make lint

      - name: Run conductor tests
        run: make conductor-selftest

      - name: Set up Node for pinned Codex CLI
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.159.0

      - name: Validate Codex app-server schema contract
        run: make dev-codex-schema-check

      - name: Run release workflow tests
        run: make release-selftest

  select-module-tests:
    name: Select Affected Module Tests
    runs-on: macos-26
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_modules: ${{ steps.select.outputs.has_modules }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select affected app-free test targets
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          matrix="$(python3 Scripts/modularization_affected_tests.py --base "$BASE_SHA")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"include":[]}' ]]; then
            echo 'has_modules=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_modules=true' >> "$GITHUB_OUTPUT"
          fi

  build-test-bundles:
    name: Build Root Test Bundles Once
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore SwiftPM dependency sources only
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-sources-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Build root test bundles with import and type-check gates
        shell: bash
        run: |
          set -uo pipefail
          ./conductor ci-build-tests 2>&1 | tee "$RUNNER_TEMP/ci-build-tests-conductor.txt"
          build_status=${PIPESTATUS[0]}
          if (( build_status != 0 )); then
            log_path="$(sed -n 's/^Log:[[:space:]]*//p' "$RUNNER_TEMP/ci-build-tests-conductor.txt" | tail -n 1)"
            if [[ -n "$log_path" && -f "$log_path" ]]; then
              cp "$log_path" "$RUNNER_TEMP/ci-build-tests.log"
              echo 'Compiler errors and test failures from the full conductor log:'
              grep -E 'error:|FAIL' "$RUNNER_TEMP/ci-build-tests.log" || true
            else
              echo "Conductor full log was unavailable: $log_path" >&2
            fi
          fi
          exit "$build_status"

      - name: Upload failed root test build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: root-build-tests-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-build-tests.log
            ${{ runner.temp }}/ci-build-tests-conductor.txt
          if-no-files-found: warn

      - name: Gate compiler index ratchets on the built sources
        run: python3 Scripts/modularization_index_graph.py check --output .build/modularization/index-check.json

      - name: Archive only runnable test products and gate attestations
        run: python3 Scripts/modularization_ci_artifact.py pack --output root-build.tar.gz

      - name: Share the single build with test shards
        uses: actions/upload-artifact@v4
        with:
          name: root-build-${{ github.run_id }}
          path: root-build.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  build-and-test:
    name: Test Root Shard ${{ matrix.shard }} (No Build)
    needs: build-test-bundles
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the single root build
        uses: actions/download-artifact@v4
        with:
          name: root-build-${{ github.run_id }}

      - name: Restore build bundle and SwiftPM state
        shell: bash
        run: gzip -dc root-build.tar.gz | tar -xf -

      - name: Run root test shard without compiling
        run: ./conductor ci-shard --shard-count 4 --shard-index ${{ matrix.shard }}

  module-tests:
    name: Module Tests (${{ matrix.module }})
    needs: select-module-tests
    if: needs.select-module-tests.outputs.has_modules == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-module-tests.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore SwiftPM dependency sources only
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-sources-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Run owning module tests through conductor
        run: ./conductor test --module ${{ matrix.module }}

  sentry-enabled-build:
    name: Sentry-enabled Build (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: |
            .build
            Packages/RepoPromptAgentProviders/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-sentry-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-

      - name: Build app product with Sentry SDK linked
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: ./conductor swift-build --product RepoPrompt

      - name: Test serialized Sentry privacy boundary
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: ./conductor test --filter SentryTelemetryPrivacyTests

  provider-tests:
    name: Provider Tests
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: |
            .build
            Packages/RepoPromptAgentProviders/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-provider-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-

      - name: Run provider package tests
        run: ./conductor provider-test

  secret-scan:
    name: Secret Scan
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: brew install gitleaks

      - name: Scan introduced commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            range="$CURRENT_SHA"
          fi
          gitleaks git --redact --log-opts="$range" .

      - name: Scan checked-in source tree
        run: gitleaks dir --redact .
